<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守岸人的港湾</title>
    <style>
        /* 全局设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #0a0f18; /* 深蓝色底色 */
        }

        /* 背景图容器 */
        .bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* 开场动画层 */
        .intro-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
        }

        /* 蝴蝶容器 */
        .butterfly-wrapper {
            position: relative; width: 300px; height: 300px;
        }

        /* 蝴蝶样式与动画 */
        .butterfly {
            position: absolute; top: 50%; left: 50%;
            width: 24px; height: 24px;
            background: rgba(100, 180, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 15px #64b4ff, 0 0 30px #64b4ff;
            transform: translate(-50%, -50%) rotate(45deg);
            opacity: 0;
        }
        .butterfly::before, .butterfly::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.5);
            background: radial-gradient(circle, #fff, transparent);
        }
        .butterfly::before { transform: translateX(-100%) scaleX(0.8); transform-origin: right; }
        .butterfly::after { transform: translateX(100%) scaleX(0.8); transform-origin: left; }

        .b1 { animation: flyLeft 2s ease-in-out 0.5s forwards; }
        .b2 { animation: flyRight 2s ease-in-out 0.5s forwards; }
        .b3 { animation: flyTop 2s ease-in-out 0.5s forwards; }
        .b4 { animation: flyBottom 2s ease-in-out 0.5s forwards; }

        @keyframes flyLeft { 0% { opacity: 0; transform: translate(-300px, 0) rotate(45deg) scale(0); } 100% { opacity: 1; transform: translate(-150px, 0) rotate(45deg) scale(1); } }
        @keyframes flyRight { 0% { opacity: 0; transform: translate(300px, 0) rotate(45deg) scale(0); } 100% { opacity: 1; transform: translate(150px, 0) rotate(45deg) scale(1); } }
        @keyframes flyTop { 0% { opacity: 0; transform: translate(0, -300px) rotate(45deg) scale(0); } 100% { opacity: 1; transform: translate(0, -150px) rotate(45deg) scale(1); } }
        @keyframes flyBottom { 0% { opacity: 0; transform: translate(0, 300px) rotate(45deg) scale(0); } 100% { opacity: 1; transform: translate(0, 150px) rotate(45deg) scale(1); } }

        /* 进入按钮 */
        .enter-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 180, 255, 0.5);
            color: #fff; font-size: 1.1em; letter-spacing: 2px;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(100, 180, 255, 0.3);
            opacity: 0; pointer-events: none;
            transition: all 0.3s;
            animation: btnShow 1s ease-in-out 2.5s forwards;
        }
        .enter-btn:hover {
            background: rgba(100, 180, 255, 0.2);
            box-shadow: 0 0 30px rgba(100, 180, 255, 0.6);
            transform: translate(-50%, -50%) scale(1.05);
        }
        @keyframes btnShow { to { opacity: 1; pointer-events: auto; } }

        /* 主页内容层 */
        .main-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 1s ease;
            pointer-events: none;
        }

        .card {
            background: rgba(10, 15, 24, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            padding: 40px 60px; border-radius: 20px;
            text-align: center; color: #fff;
            max-width: 500px; width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card h1 { font-size: 2em; margin-bottom: 15px; font-weight: 500; }
        .card p { color: #a0b2d6; line-height: 1.8; margin-bottom: 15px; }
        .card .tag { display: inline-block; margin: 5px; padding: 5px 15px; background: rgba(100, 180, 255, 0.15); border-radius: 15px; font-size: 0.85em; color: #64b4ff; }

        /* 隐藏类 */
        .hidden { opacity: 0 !important; pointer-events: none; }
        .visible { opacity: 1 !important; pointer-events: auto; }
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- 背景图 -->
    <div class="bg-container" id="bg"></div>

    <!-- 开场动画层 -->
    <div class="intro-layer" id="intro">
        <div class="butterfly-wrapper">
            <div class="butterfly b1"></div>
            <div class="butterfly b2"></div>
            <div class="butterfly b3"></div>
            <div class="butterfly b4"></div>
            <button class="enter-btn" id="enterBtn">进入</button>
        </div>
    </div>

    <!-- 主页内容层 -->
    <div class="main-content" id="main">
        <div class="card">
            <h1>你好，我是 XXX</h1>
            <p>在这里，时间如潮水般流转，而我为你守望。<br>欢迎来到我的私人领地，这里是属于我们的一片宁静海岸。</p >
            <div>
                <span class="tag"># 鸣潮</span>
                <span class="tag"># 守岸人</span>
                <span class="tag"># 蓝色星空</span>
                <span class="tag"># 个人主页</span>
            </div>
        </div>
    </div>

    <script>
    const bgm = document.getElementById('bgm');
    const intro = document.getElementById('intro');
    const main = document.getElementById('main');
    const bg = document.getElementById('bg');
    const enterBtn = document.getElementById('enterBtn');

    enterBtn.addEventListener('click', function () {
        bgm.play().catch(function () {});
        bg.classList.add('visible');
        intro.classList.add('hidden');
        main.classList.add('visible');
    });
</script>
